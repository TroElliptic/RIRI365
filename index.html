<script>
   function createHeart(containerSelector) {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerText = "❤️";

  // Random size 10–25px
  heart.style.fontSize = 10 + Math.random() * 15 + "px";

  // Random horizontal wiggle (used in CSS)
  heart.style.setProperty('--rand', Math.random());

  // Random animation duration for variation
  heart.style.animationDuration = 5 + Math.random() * 3 + "s";

  // Append to container
  document.querySelector(containerSelector).appendChild(heart);

  // Remove after animation finishes
  setTimeout(() => heart.remove(), parseFloat(heart.style.animationDuration) * 1000);
}

// Spawn hearts left and right every 0.5s
setInterval(() => createHeart(".hearts.left"), 500);
setInterval(() => createHeart(".hearts.right"), 500);

  </script>

  <script>
function updateCountdown() {
  const now = new Date();

  // Next midnight
  const tomorrow = new Date();
  tomorrow.setHours(24, 0, 0, 0);

  const diff = tomorrow - now;

  const hours = Math.floor(diff / (1000 * 60 * 60));
  const minutes = Math.floor((diff / (1000 * 60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById("countdown").innerText =
    `Next message in ${hours}h ${minutes}m ${seconds}s`;
}

// Update every second
setInterval(updateCountdown, 1000);
updateCountdown();
</script>
